name: Redot 26.2 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download pinned Redot 26.2
        shell: pwsh
        run: |
          $url = 'https://github.com/Redot-Engine/redot-engine/releases/download/redot-26.2-stable/Redot_v26.2-stable_windows_win64.zip'
          $expected = '4644c7591bbe8019b861deb0ccdb64fd4f59a88514abf7c788cf176c259855af'
          Invoke-WebRequest -Uri $url -OutFile redot.zip
          $actual = (Get-FileHash -LiteralPath redot.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Redot archive digest mismatch: $actual"
          }
          Expand-Archive -LiteralPath redot.zip -DestinationPath .redot
          $redot = (Get-ChildItem -LiteralPath .redot -Recurse -Filter '*.console.exe' | Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($redot)) {
            throw 'Redot console executable was not found in the verified archive.'
          }
          "REDOT_BIN=$redot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run conformance suite
        shell: pwsh
        run: ./tools/run_tests.ps1 -RedotBin $env:REDOT_BIN

      - name: Build review archive
        shell: pwsh
        run: ./tools/package_addon.ps1

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: redotp2pnetwork-test-logs
          path: tests/.artifacts
          if-no-files-found: ignore
          retention-days: 7
